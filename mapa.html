<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<link rel="icon" href="assets/brand/favicon.svg" type="image/svg+xml">
<link rel="icon" href="assets/brand/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="assets/brand/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#3A4A34">
<meta name="application-name" content="Wherethru">
<meta property="og:site_name" content="Wherethru">
<meta property="og:image" content="assets/brand/og-image.png">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mapa míst · Wherethru</title>
<meta name="description" content="Mapa skutečných míst v Česku a v Bavorsku s údaji o přístupnosti pro lidi na vozíku: vstup, toaleta, parkování ZTP. Filtrujte podle svých potřeb.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Mono:wght@400;700&family=Atkinson+Hyperlegible+Next:wght@400;600;700&family=Caveat:wght@500&family=Fraunces:opsz,wght@9..144,600&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap">
<link rel="stylesheet" href="assets/css/style.css?v=18">
<link rel="stylesheet" href="assets/css/filters.css?v=2">
<link rel="stylesheet" href="assets/css/mapa.css?v=15">
</head>
<body class="page-map">
<div id="site-header"></div>
<main id="main" class="map-layout" data-sheet="peek">
  <h1 class="sr-only" data-i18n>Mapa přístupných míst</h1>

  <!-- Hledání, kategorie a rychlé filtry: na PC nahoře v levém sloupci, na mobilu plovoucí nad mapou -->
  <div class="map-top" id="map-top">
    <form class="search-bar map-search" role="search" id="search-form">
      <span class="sb-ic" data-icon="search"></span>
      <label class="sr-only" for="q" data-i18n>Hledat obec nebo místo</label>
      <input id="q" type="search" placeholder="Hledat obec nebo místo" autocomplete="off" list="obce" enterkeyhint="search" data-i18n-attr="placeholder">
      <datalist id="obce"></datalist>
      <button type="button" class="search-filter" id="filters-open" aria-haspopup="dialog" aria-controls="kf-panel" aria-expanded="false" aria-label="Filtry" data-i18n-attr="aria-label"><span data-icon="sliders"></span><span class="kf-count" id="filter-count" hidden>0</span></button>
    </form>
    <div class="kf-cats-wrap">
      <button type="button" class="kf-scroll prev" data-scroll="-1" aria-label="Posunout kategorie doleva" tabindex="-1" data-i18n-attr="aria-label"><span data-icon="chevron-left"></span></button>
      <div class="kf-cats" id="kf-cats" role="group" aria-label="Kategorie" data-i18n-attr="aria-label"></div>
      <button type="button" class="kf-scroll next" data-scroll="1" aria-label="Posunout kategorie doprava" tabindex="-1" data-i18n-attr="aria-label"><span data-icon="chevron-right"></span></button>
    </div>
    <div class="kf-quick-slot" id="quick-top">
      <div class="kf-quick" id="kf-quick" role="group" aria-label="Rychlé filtry přístupnosti" data-i18n-attr="aria-label"></div>
      <div class="kf-active" id="kf-active" hidden></div>
    </div>
  </div>

  <!-- Výsledky: na PC sloupec vlevo, na mobilu vysouvací panel zespodu -->
  <section class="map-panel" id="panel" aria-label="Výsledky" data-i18n-attr="aria-label">
    <button type="button" class="sheet-grip" id="grip" aria-label="Zvětšit seznam" aria-controls="panel" data-i18n-attr="aria-label"><span></span></button>
    <div id="preview" class="preview" hidden></div>
    <div class="results-head" id="results-head">
      <div class="head-row">
        <p id="count" aria-live="polite" class="count" data-i18n>Načítám místa…</p>
        <button type="button" class="btn btn-primary btn-sm view-btn" id="view-btn"><span data-icon="list"></span><span class="lbl" data-i18n>Seznam</span></button>
      </div>
      <div class="kf-quick-slot" id="quick-sheet"></div>
      <div class="head-row tools">
        <label class="check in-view" data-i18n-text><input type="checkbox" id="in-view" checked> Jen v oblasti mapy</label>
        <label class="sort-wrap"><span class="sr-only" data-i18n>Řadit výsledky</span>
          <select id="sort" class="sort">
            <option value="complete" data-i18n>Nejvíc údajů</option>
            <option value="near" data-i18n>Vzdálenost</option>
            <option value="match" data-i18n>Shoda s mými potřebami</option>
            <option value="photo" data-i18n>S fotkou nahoře</option>
            <option value="measured" data-i18n>Naměřené nahoře</option>
            <option value="fresh" data-i18n>Naposledy upravené</option>
            <option value="name" data-i18n>Podle názvu</option>
          </select>
        </label>
      </div>
    </div>
    <div class="panel-scroll" id="panel-scroll">
      <ol class="results rc-list" id="results"></ol>
      <div class="more-row"><button class="btn btn-ghost btn-block" type="button" id="more" hidden data-i18n>Zobrazit další</button></div>
    </div>
  </section>

  <section class="map-wrap" id="map-wrap" aria-label="Mapa" data-i18n-attr="aria-label">
    <div id="map" class="map-canvas" role="application" aria-label="Mapa míst" data-i18n-attr="aria-label"></div>
    <div class="map-tools">
      <button class="map-btn" type="button" id="layers-btn" aria-haspopup="true" aria-expanded="false" aria-controls="layers" aria-label="Vrstvy mapy" title="Vrstvy mapy" data-i18n-attr="aria-label,title"><span data-icon="layers"></span></button>
      <button class="map-btn" type="button" id="locate" aria-label="Moje poloha" title="Moje poloha" data-i18n-attr="aria-label,title"><span data-icon="locate"></span></button>
    </div>
    <div class="layers-pop" id="layers" hidden>
      <p class="kicker" data-i18n>Podklad mapy</p>
      <div class="seg" role="group" aria-label="Podklad mapy" data-i18n-attr="aria-label">
        <button type="button" data-tiles="soft" aria-pressed="true" data-i18n>Tlumený</button>
        <button type="button" data-tiles="color" aria-pressed="false" data-i18n>Barevný</button>
      </div>
      <label class="check"><input type="checkbox" id="legend-toggle" checked> <span data-i18n>Legenda značek</span></label>
    </div>
    <div class="legend" id="legend" aria-label="Legenda značek" data-i18n-attr="aria-label">
      <span class="legend-t" data-i18n>Odznak na značce = vstup</span>
      <span class="status ok" data-i18n><i></i>Přístupné</span><span class="status part" data-i18n><i></i>Částečně</span><span class="status no" data-i18n><i></i>Nepřístupné</span><span class="status unk" data-i18n><i></i>Neuvedeno</span>
    </div>
    <p class="map-engine-note" id="engine-note" hidden></p>
  </section>

  <!-- Panel Filtry (vytváří assets/js/filters.js): na PC postranní panel přes levý sloupec, na mobilu spodní panel -->
  <div class="kf-host map-kf" id="kf-host"></div>
</main>

<script src="assets/js/i18n.js?v=3"></script>
<script src="assets/js/i18n/core.js?v=6"></script>
<script src="assets/js/i18n/xrows.js?v=1"></script>
<script src="assets/js/i18n/filters.js?v=2"></script>
<script src="assets/js/i18n/mapa.js?v=4"></script>
<script src="assets/js/config.js?v=12"></script>
<script src="assets/icons/icons.js?v=1"></script>
<script src="assets/js/core.js?v=18"></script>
<script src="assets/js/filters.js?v=4"></script>
<script src="assets/js/map-engine.js?v=16"></script>
<script src="assets/js/mapa.js?v=17"></script>
</body>
</html>
